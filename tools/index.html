<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<script>
  (function(){
    try {
      var urlParams = new URLSearchParams(window.location.search);
      var saved = urlParams.get('theme') || localStorage.getItem("toolhub-theme");
      if (saved === "light") {
        document.documentElement.setAttribute("data-theme", "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#f8fafc");
      }
    } catch(e) {}
  })();
</script>
<title>ToolHub — Banque d'outils</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300ffa3'/%3E%3Cstop offset='100%25' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2307070d'/%3E%3Cstop offset='100%25' stop-color='%23121225'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='128' fill='url(%23bg)'/%3E%3Crect x='64' y='64' width='384' height='384' rx='88' fill='url(%23g)'/%3E%3Cg fill='%2307070d'%3E%3Crect x='128' y='128' width='112' height='112' rx='24'/%3E%3Crect x='272' y='128' width='112' height='112' rx='24'/%3E%3Crect x='128' y='272' width='112' height='112' rx='24'/%3E%3Crect x='272' y='272' width='112' height='112' rx='24'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"></noscript>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="aurora"><div class="blob3"></div></div>
<div class="grain"></div>

<header>
  <div class="header-inner">
    <!-- <a href="/" class="icon-btn home-btn" title="Retour à l'accueil vimart.net" aria-label="Accueil">
      <i class="fa-solid fa-house"></i>
    </a> -->
    <div class="logo">
      <div class="logo-mark"><i class="fa-solid fa-table-cells-large"></i></div>
      ToolHub
    </div>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" class="search" id="search" placeholder="Rechercher un outil, une fonction..." autocomplete="off">
      <span class="kbd-hint">/</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" title="Changer de thème" aria-label="Thème"><i class="fa-solid fa-moon"></i></button>
      <button class="icon-btn" id="random-btn" title="Outil au hasard" aria-label="Aléatoire"><i class="fa-solid fa-shuffle"></i></button>
    </div>
  </div>
  <div class="search-wrap mobile-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" class="search" id="search-mobile" placeholder="Rechercher un outil..." autocomplete="off">
  </div>
</header>

<section class="hero">
  <h1>Les <span class="grad">meilleurs</span><br>outils en ligne <span class="grad">gratuits</span></h1>
  <!-- <p>Les meilleurs outils en ligne gratuits</p> -->
  <div class="hero-stats">
    <div class="stat"><span class="stat-num" id="stat-tools">0</span><span class="stat-label">Outils</span></div>
    <div class="stat"><span class="stat-num" id="stat-cats">0</span><span class="stat-label">Catégories</span></div>
    <div class="stat"><span class="stat-num" id="stat-favs">0</span><span class="stat-label">Favoris</span></div>
  </div>
</section>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-cats" id="mobile-cats"></div>
    <div id="favorites-section" class="favorites-section">
      <div class="section-header">
        <i class="fa-solid fa-star fav-star"></i>
        <h2 class="section-title">Favoris</h2>
        <div class="section-line"></div>
        <span class="section-count" id="fav-count">0</span>
      </div>
      <div class="grid" id="favorites-grid"></div>
    </div>
    <div class="section-header">
      <h2 class="section-title" id="grid-title">Tous les outils</h2>
      <div class="section-line"></div>
      <span class="section-count" id="grid-count">0</span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<footer>
  <p><strong>ToolHub</strong> — Cliquez sur un bloc pour ouvrir l'outil. Étoile pour ajouter aux favoris. Raccourci <kbd>/</kbd> pour chercher, <kbd>Esc</kbd> pour effacer.</p>
</footer>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="main.js" defer></script>
</body>
</html>
