<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spend</title>
  <meta name="description" content="Note tes dépenses en deux secondes." />
  <meta name="theme-color" content="#07080f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spend" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Applique le thème avant le rendu pour éviter le flash
    try { const t = localStorage.getItem('spend.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">€</span>
        <h1>Spend</h1>
      </div>
      <div class="theme-switch glass" role="radiogroup" aria-label="Thème">
        <button role="radio" data-theme-opt="light" aria-label="Clair" title="Clair">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button role="radio" data-theme-opt="auto" aria-label="Automatique" title="Automatique">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" class="fill"/></svg>
        </button>
        <button role="radio" data-theme-opt="dark" aria-label="Sombre" title="Sombre">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>

    <section class="summary">
      <p class="summary-label" id="summaryLabel">Ce mois-ci</p>
      <p class="summary-total" id="summaryTotal">0,00 €</p>
      <p class="summary-sub" id="summarySub">Aucune dépense</p>
    </section>

    <section class="hero">
      <button class="big-btn" id="addBtn" aria-label="Nouvelle dépense">
        <span class="big-ring" aria-hidden="true"></span>
        <span class="big-core">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Dépense</span>
        </span>
      </button>
    </section>

    <section class="actions">
      <button class="pill glass" id="exportBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/></svg>
        Exporter
      </button>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>Historique</h2>
        <span class="count" id="count">0</span>
      </div>
      <div id="list" class="list"></div>
      <div class="empty glass" id="empty">
        <p>Rien pour l'instant.</p>
        <p class="muted">Appuie sur le gros bouton pour noter ta première dépense.</p>
      </div>
      <button class="reset-link" id="resetBtn">Vider la liste</button>
    </section>
  </main>

  <!-- Feuille de saisie -->
  <div class="overlay" id="entryOverlay" aria-hidden="true">
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <h3 id="entryTitle">Nouvelle dépense</h3>
        <button class="icon-btn" data-close aria-label="Fermer">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="entry-date" id="entryDate"></p>

      <div class="amount" id="amountDisplay" aria-live="polite"></div>

      <div class="desc-wrap">
        <input id="descInput" type="text" placeholder="Description (facultatif)" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" maxlength="80" />
      </div>
      <div class="chips" id="chips"></div>

      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="." class="k-alt">,</button><button data-k="0">0</button>
        <button data-k="back" class="k-alt" aria-label="Effacer">
          <svg viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>
        </button>
      </div>

      <div class="sheet-foot">
        <button class="danger-ghost" id="deleteNoteBtn" hidden>Supprimer</button>
        <button class="primary" id="saveBtn" disabled>Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Export -->
  <div class="overlay" id="exportOverlay" aria-hidden="true">
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <h3 id="exportTitle">Exporter</h3>
        <button class="icon-btn" data-close aria-label="Fermer">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <pre class="preview" id="exportPreview"></pre>
      <div class="export-actions">
        <button class="primary wa" id="waBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.6a8.2 8.2 0 0 1-12.1 7.2L4 20l1.3-3.8A8.2 8.2 0 1 1 20 11.6z"/></svg>
          WhatsApp
        </button>
        <button class="secondary" id="copyBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          Copier
        </button>
        <button class="secondary" id="shareBtn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/></svg>
          Partager
        </button>
      </div>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="overlay center" id="confirmOverlay" aria-hidden="true">
    <div class="dialog glass-strong" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </div>
      <h3 id="confirmTitle">Vider la liste ?</h3>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button class="secondary" data-close>Annuler</button>
        <button class="danger" id="confirmResetBtn">Tout supprimer</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastAction" hidden>Annuler</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
